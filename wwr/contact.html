<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="This is the Contact Page for the Whitewater Rafting Site Project">
        <meta name="author" content="Heriniaina Andriananjamarotafika">
        <title>Contact us | Rapids</title>
        <link rel="stylesheet" href="styles/rafting.css">
    </head>

    <body>
        <header>
            <img src="images/wwrlogo.jpeg" alt="The Whitewater Rafting Logo">
            <nav>
                <ul class="navigation">
                    <li> <a href="index.html">Home</a></li>
                    <li> <a href="about.html">About Us</a></li>
                    <li> <a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>

        </header>
        <main>
            <div class="top-contact">
                <h1>White Water Rafting Company</h1>
                <p>456 Rapids Lane, Boulder, CO 80301</p>
                <p>(303) 555-1234</p>
                <p>info@rapidsrafting.com</p>
            </div>
            <div class="middle-contact">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3104.7923!2d-105.2705!3d40.0150!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x876b8d4e9c6b5c1f%3A0x1234567890abcdef!2s456%20Rapids%20Lane%2C%20Boulder%2C%20CO%2080301!5e0!3m2!1sen!2sus!4v1234567890!5m2!1sen!2sus"
                    width="600" height="450" allowfullscreen
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label>Message Purpose:</label>
                    <div class="radio-list">
                        <input type="radio" id="general" name="purpose"
                            value="general" required>
                        <label for="general">General Inquiry</label>
                        <input type="radio" id="reservation" name="purpose"
                            value="reservation">
                        <label for="reservation">Reservation Question</label>
                        <input type="radio" id="suggestion" name="purpose"
                            value="suggestion">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message"
                        placeholder="Type here"></textarea>
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthly
                        newsletter</label>
                    <button type="submit">Get in touch</button>
                </form>
            </div>
            <section class="bottom-contact">
                <h2>We Are Here to Serve You!</h2>
                <div class="figure_image">
                    <figure>
                        <img src="images/man.jpg" alt="Mr Bill">
                        <figcaption>Mr Bill</figcaption>
                    </figure>
                    <figure>
                        <img src="images/miss.jpg" alt="Miss Jane">
                        <figcaption>Miss Jane</figcaption>
                    </figure>
                    <figure>
                        <img src="images/woman.jpg" alt="Mrs Smith">
                        <figcaption>Mrs Smith</figcaption>
                    </figure>
                </div>
            </section>
        </main>
        <footer>
            <p>©2026 . The Whitewater Rafting . Heriniaina
                Andriananjamarotafika</p>
            <nav class="socialmedia">
                <a href="http://www.facebook.com"><img src="images/facebook.png"
                        alt="Facebook logo"></a>
                <a href="http://linkedin.com"><img src="images/linkedin.png"
                        alt="Linkedin logo"></a>
                <a href="http://instagram.com"><img src="images/instagram.png"
                        alt="Instagram Logo"></a>
            </nav>
        </footer>
    </body>

</html>
