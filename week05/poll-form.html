<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/poll-form.css">
        <title>Document</title>
    </head>

    <body>
        <header>
        </header>
        <main>
            <form>
                <fieldset>
                    <legend>Contact Information</legend>
                    <div class="form-item column1">
                        <label for="fullname column2">Fullname :<input
                                type="text"
                                name="fullname" id="fullname"
                                required></label>
                    </div>
                    <div class="form-item column1">
                        <label for="useremail">Email :<input type="email"
                                name="email"
                                id="useremail"
                                required></label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Questions</legend>
                    <div class="form-item column2">
                        <label for="browser">What is your
                            favorite browser?</label>
                        <select name="browser" id="browser">
                            <option value="firefox">Firefox</option>
                            <option value="chrome">Chrome</option>
                            <option value="safari">Safari</option>
                            <option value="brave">Brave</option>
                            <option value="opera">Opera</option>
                            <option value="edge">Edge</option>
                            <option value="other">Other</option>
                        </select></div>
                    <div class="form-item column2"> <label for="pet">Do you have
                            a
                            household
                            pet?</label>
                        <input type="checkbox" name="pet" id="pet"></div>
                    <div class="form-item column2">
                        <label for="feedback">List the places you have lived
                            :</label>
                        <textarea name="feedback" id="feedback" rows="10"
                            placeholder="And it came to pass,....."></textarea></div>

                </fieldset>

                <button type="submit">Submit Poll</button>
            </form>
        </main>
        <footer>

        </footer>
    </body>

</html>
